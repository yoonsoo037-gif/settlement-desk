<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>정산 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style><style>
/* Layout: 정산 서류철 — 왼쪽 단계 목차(sticky) + 오른쪽 작업 패널. 금액은 장부식 고정폭 숫자. */
html, body { margin: 0; }
:root {
  --paper: #f3f5f7;
  --sheet: #ffffff;
  --ink: #18212b;
  --ink-2: #4a5866;
  --line: #d9dfe5;
  --line-2: #e9edf1;
  --accent: #1b5e7a;      /* 원장 청록 — 확정·주요 동작 */
  --accent-soft: #e3eff4;
  --stamp: #b4462c;       /* 결재 도장 적색 — 필수 양식 표시 */
  --ok: #2c7a4b; --ok-bg: #e5f3ea;
  --warn: #9a6a00; --warn-bg: #fbf1d9;
  --bad: #b3261e; --bad-bg: #fbe6e4;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11171c; --sheet: #182129; --ink: #e6ecf1; --ink-2: #9fb0bf; --line: #2c3a46; --line-2: #22303a;
  --accent: #6fb6d3; --accent-soft: #1b3341; --stamp: #f08a6c;
  --ok: #7fd3a0; --ok-bg: #173226; --warn: #f0c35a; --warn-bg: #352a10; --bad: #ff8f86; --bad-bg: #3a1a18; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #11171c; --sheet: #182129; --ink: #e6ecf1; --ink-2: #9fb0bf; --line: #2c3a46; --line-2: #22303a;
  --accent: #6fb6d3; --accent-soft: #1b3341; --stamp: #f08a6c;
  --ok: #7fd3a0; --ok-bg: #173226; --warn: #f0c35a; --warn-bg: #352a10; --bad: #ff8f86; --bad-bg: #3a1a18; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.num, td.n, .tile b { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--line);
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.brand small { color: var(--ink-2); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--sheet); white-space: nowrap; }
.chip.sample { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }
.chip.live { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.wrap { max-width: 1080px; margin: 0 auto; padding-block: 20px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 1240px; margin: 10px auto -12px; display: flex; gap: 4px; overflow-x: auto; }
.tab { border: 0; border-bottom: 2.5px solid transparent; background: none; padding: 9px 14px; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; display: flex; gap: 7px; align-items: center; }
.tab span { font-family: var(--f-num); font-size: 11px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; border: 1px solid currentColor; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabpanel { display: grid; gap: 18px; min-width: 0; }
.tabpanel[hidden], [hidden] { display: none !important; }
details.fold > summary { cursor: pointer; list-style-position: inside; }
details.fold[open] > summary { margin-bottom: 4px; }
.status { all: unset; cursor: pointer; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 9px 12px; border-radius: 8px; font-size: 13px; }
.status:focus-visible { outline: 2px solid var(--accent); }
.status.ok { background: var(--ok-bg); color: var(--ok); } .status.warn { background: var(--warn-bg); color: var(--warn); } .status.bad { background: var(--bad-bg); color: var(--bad); }
.btn.big { padding: 11px 18px; font-size: 14px; }
.gate { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: var(--paper);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.gate-box { width: 100%; max-width: 360px; display: grid; gap: 8px; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 26px 24px; }
.gate-box h2 { font-size: 20px; }
.brand .home { color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 14px; }
.brand .home:hover { color: var(--accent); }
.brand .sep { color: var(--line); }
.gate-kicker { margin: 0; font-size: 12px; color: var(--accent); letter-spacing: 0.04em; }
.gate-box input { padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--sheet); color: var(--ink); font-size: 15px; }
body.locked .top, body.locked .wrap { visibility: hidden; }
.brand h1 a { color: inherit; text-decoration: none; }
.brand .track { font-weight: 700; font-size: 18px; }
.home-intro { display: grid; gap: 6px; }
.home-intro h2 { font-size: 18px; }
.tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.tcard { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--sheet); display: grid; gap: 4px; }
.tcard b { font-size: 15px; }
.tcard .tstate { justify-self: start; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); }
.tcard .tstate.ready { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.pick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.form input, .form select { width: 100%; min-width: 0; box-sizing: border-box; }
.pick select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); color: var(--ink); }
.allcopy { display: flex; align-items: end; }
main { display: grid; gap: 18px; min-width: 0; }

.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; min-width: 0; scroll-margin-top: 130px; }
.ph { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.ph .step { font-family: var(--f-num); font-size: 12px; color: var(--accent); letter-spacing: 0.04em; }
.ph h2 { font-size: 16px; font-weight: 700; }
.ph p { margin: 0; color: var(--ink-2); font-size: 13px; flex-basis: 100%; }
.muted { color: var(--ink-2); }
.small { font-size: 12px; }

.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 8px; justify-items: start; background: var(--paper); cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { font-size: 15px; }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 7px; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn.primary:hover { filter: brightness(1.08); color: var(--sheet); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

details.logic { border-top: 1px solid var(--line-2); padding-top: 10px; }
details.logic summary { cursor: pointer; font-weight: 600; font-size: 13px; }
details.logic ol { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 4px; color: var(--ink-2); max-width: 75ch; }

.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); text-align: left; white-space: nowrap; }
th { font-weight: 600; font-size: 12px; color: var(--ink-2); background: var(--paper); letter-spacing: 0.02em; }
td.n, th.n { text-align: right; }
tr.sum td { font-weight: 700; border-top: 1px solid var(--line); background: var(--paper); }
tr:last-child td { border-bottom: 0; }
td input.rate { width: 96px; text-align: right; font-family: var(--f-num); padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--sheet); }
td input.rate.empty { border-color: var(--bad); background: var(--bad-bg); }
.plug { font-size: 11px; color: var(--warn); margin-left: 6px; }

.flags { display: grid; gap: 6px; }
.flag { display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: start; padding: 8px 12px; border-radius: 7px; font-size: 13px; }
.flag b { font-size: 11px; font-weight: 700; text-align: center; padding: 1px 0; border-radius: 4px; letter-spacing: 0.04em; }
.flag.ok { background: var(--ok-bg); } .flag.ok b { color: var(--ok); border: 1px solid var(--ok); }
.flag.warn { background: var(--warn-bg); } .flag.warn b { color: var(--warn); border: 1px solid var(--warn); }
.flag.bad { background: var(--bad-bg); } .flag.bad b { color: var(--bad); border: 1px solid var(--bad); }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: 9px; padding: 14px 16px; display: grid; gap: 4px; }
.tile span { font-size: 12px; color: var(--ink-2); }
.tile b { font-size: clamp(20px, 3vw, 26px); font-weight: 600; letter-spacing: -0.02em; }
.tile.main { border-color: var(--accent); background: var(--accent-soft); }
.tile em { font-style: normal; font-size: 12px; color: var(--ink-2); }
@media (max-width: 640px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 20px; font-size: 13px; }
.meta div { display: grid; gap: 2px; }
.meta span { font-size: 12px; color: var(--ink-2); }

.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.form label { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
.form input, .form select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); font-size: 14px; color: var(--ink); }
.form input.need { border-color: var(--bad); background: var(--bad-bg); }

.block { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; min-width: 0; }
.block > header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 9px 12px; background: var(--paper); border-bottom: 1px solid var(--line); }
.block > header h3 { font-size: 13px; font-weight: 700; }
.block > .body { padding: 12px; display: grid; gap: 10px; min-width: 0; }
.block.fixed { border-color: var(--stamp); }
.block.fixed > header { background: transparent; border-bottom-color: var(--stamp); }
.stamp { font-size: 11px; font-weight: 700; color: var(--stamp); border: 1.5px solid var(--stamp); border-radius: 4px; padding: 1px 6px; letter-spacing: 0.04em; }
pre.fmt { margin: 0; font-family: var(--f-num); font-size: 13px; line-height: 1.7; white-space: pre-wrap; background: var(--paper); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; gap: 6px 14px; margin: 0; align-items: center; font-size: 13px; }
dl.kv dt { color: var(--ink-2); font-size: 12px; }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 520px) { dl.kv { grid-template-columns: minmax(0, 1fr) auto; } dl.kv dt { grid-column: 1 / -1; } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--sheet); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; }
.fallback { display: grid; gap: 6px; }
.fallback textarea { width: 100%; min-height: 120px; font-family: var(--f-num); font-size: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); padding: 8px; }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.cols2 > * { min-width: 0; }
.hist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.hist div { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 5px; background: var(--paper); font-size: 12px; }
.hist div.cur { background: var(--accent-soft); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .btn, .drop { transition: border-color .15s, background .15s; } }
</style>
</head>
<body class="locked">

<header class="top">
  <div class="top-in">
    <div class="brand"><h1><a href="./" title="첫 화면">정산 데스크</a></h1><span class="sep" id="trackSep" hidden>/</span><span class="track" id="trackName"></span><small id="trackDesc">정산 계산기</small></div>
    <div class="chips"><span class="chip" id="chipQ" hidden>—</span><span class="chip live" id="chipMode" hidden></span><button class="btn sm" id="btnNew" type="button" hidden>다른 파일</button><button class="btn sm" id="btnLogout" type="button">잠금</button></div>
  </div>
  <div id="tabsSlot"></div>
</header>

<div class="wrap">
  <main>
    <section class="panel" id="home">
      <div class="home-intro">
        <h2>정산 원본을 올려 주세요</h2>
        <p class="small muted" style="margin:0">파일 구조를 보고 어떤 정산인지 판별한 뒤, 그 정산의 로직으로 공급가액·부가세·총액과 산출물(ERP 전표 업로드 파일 등)을 만듭니다. 파일은 이 브라우저 안에서만 읽고 서버로 보내지 않습니다.</p>
      </div>
      <label class="drop" id="drop" for="file">
        <strong>정산 원본 엑셀을 끌어다 놓거나 클릭해서 선택</strong>
        <span class="muted small">.xlsx / .xls</span>
        <input type="file" id="file" accept=".xlsx,.xls" hidden>
      </label>
      <div id="loadMsg" class="small muted" role="status"></div>
      <div class="pick" id="pick" hidden><span class="small">정산 종류를 직접 선택:</span><select id="pickSel"></select><button class="btn sm primary" id="pickBtn" type="button">이 정산으로 읽기</button></div>
      <div class="tracks" id="trackList"></div>
    </section>
    <div id="workspace"></div>
    <div id="copyFallback" class="fallback panel" hidden><b class="small">자동 복사가 막혀 있습니다. 아래 내용을 선택해서 복사해 주세요.</b><textarea id="fbText" readonly></textarea></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<div id="gate" class="gate">
  <form id="gateForm" class="gate-box" autocomplete="off">
    <p class="gate-kicker">개인 정산 도구</p>
    <h2>정산 데스크</h2>
    <p class="small muted" style="margin:0 0 14px">비밀번호를 입력하면 들어갑니다. 정산 데이터는 파일을 올린 뒤 해당 정산 것만 불러옵니다.</p>
    <label for="gatePw" class="small muted">비밀번호</label>
    <input type="password" id="gatePw" required>
    <button class="btn primary big" id="gateBtn" type="submit">들어가기</button>
    <p class="small" id="gateMsg" role="status" style="margin:0;min-height:1.4em;color:var(--bad)"></p>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
// 정산 모듈 등록부: tracks/*.js 가 DESK.register 로 자신을 등록한다
window.DESK = { tracks: [], register: function (m) { m.ready = true; this.tracks.push(m); } };
</script>
<script src="tracks/truz.js"></script>
<script src="tracks/thegirls.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var APPS_SCRIPT_URL = (window.DESK_CONFIG || {}).appsScriptUrl || '';
  // 준비 중인 정산(모듈 등록 전). 로직은 드라이브 과거 정산을 분석·검증한 뒤 tracks/<id>.js 로 추가한다
  var PLANNED = [{ id: 'ygp', name: 'YGP', desc: '로직 분석 후 등록 예정' }];
  var current = null;

  function toast(t) { var el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { el.hidden = true; }, 2200); }
  function saveFile(name, data) {
    var url = URL.createObjectURL(new Blob([data], { type: 'application/octet-stream' }));
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function pw() { try { return sessionStorage.getItem('deskPw') || ''; } catch (e) { return ''; } }
  function setPw(v) { try { if (v) sessionStorage.setItem('deskPw', v); else sessionStorage.removeItem('deskPw'); } catch (e) { } }
  function serverError(j) { return new Error(j.error === 'unauthorized' ? '비밀번호가 맞지 않습니다' : (j.message || j.error || '서버 오류')); }
  async function get(params) {
    var res = await fetch(APPS_SCRIPT_URL + '?' + new URLSearchParams(Object.assign({ password: pw() }, params)).toString());
    var j = await res.json();
    if (!j.ok) throw serverError(j);
    return j;
  }
  function poster(track) {
    // text/plain으로 보내야 브라우저 사전요청(CORS preflight) 없이 Apps Script에 닿는다
    return async function (section, body) {
      var res = await fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ section: section, track: track, password: pw() }, body || {})) });
      var j = await res.json();
      if (!j.ok) throw serverError(j);
      return j;
    };
  }

  // ---------- 첫 화면 ----------
  function renderTrackList() {
    var all = DESK.tracks.concat(PLANNED.filter(function (p) { return !DESK.tracks.some(function (t) { return t.id === p.id; }); }));
    $('trackList').innerHTML = all.map(function (t) {
      return '<div class="tcard"><b>' + esc(t.name) + '</b><span class="small muted">' + esc(t.desc) + '</span>' +
        (t.ready ? '<span class="small muted">원본: ' + esc(t.fileHint) + '</span><span class="small muted">산출물: ' + esc(t.outputs.join(' · ')) + '</span>' : '') +
        '<span class="tstate' + (t.ready ? ' ready' : '') + '">' + (t.ready ? '사용 가능' : '준비 중') + '</span></div>';
    }).join('');
    $('pickSel').innerHTML = DESK.tracks.map(function (t) { return '<option value="' + t.id + '">' + esc(t.name) + '</option>'; }).join('');
  }
  function goHome() {
    current = null;
    $('workspace').innerHTML = ''; $('tabsSlot').innerHTML = ''; $('home').hidden = false;
    $('trackSep').hidden = true; $('trackName').textContent = ''; $('trackDesc').textContent = '정산 계산기';
    $('chipQ').hidden = true; $('chipMode').hidden = true; $('btnNew').hidden = true; $('copyFallback').hidden = true;
    document.title = '정산 데스크';
  }

  // ---------- 파일 → 판별 → 해당 정산 설정 로드 → 모듈 실행 ----------
  var pending = null;
  function handleFile(f) {
    if (!f) return;
    if (typeof XLSX === 'undefined') { $('loadMsg').textContent = '엑셀 해석 라이브러리를 불러오지 못했습니다. 페이지를 새로고침해 주세요.'; return; }
    $('pick').hidden = true; $('loadMsg').textContent = f.name + ' 읽는 중…';
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var wb = XLSX.read(new Uint8Array(rd.result), { type: 'array' });
        pending = { wb: wb, name: f.name };
        var hit = DESK.tracks.filter(function (t) { return t.detect(wb); });
        if (hit.length === 1) open(hit[0]);
        else {
          $('loadMsg').textContent = hit.length ? '같은 파일을 쓰는 정산이 여러 개입니다. 진행할 정산을 골라 주세요.' : '어떤 정산 파일인지 판별하지 못했습니다. 정산 종류를 고르거나, 원본 파일이 맞는지 확인해 주세요.';
          var opts = hit.length ? hit : DESK.tracks;
          $('pickSel').innerHTML = opts.map(function (t) { return '<option value="' + t.id + '">' + esc(t.name) + ' — ' + esc(t.desc) + '</option>'; }).join('');
          $('pick').hidden = false;
        }
      } catch (err) { $('loadMsg').textContent = '읽지 못했습니다: ' + (err && err.message ? err.message : err); }
    };
    rd.readAsArrayBuffer(f);
  }
  async function open(track) {
    if (!pending) return;
    $('loadMsg').textContent = track.name + ' 정산으로 판별했습니다. 이 정산의 설정을 불러오는 중…';
    try {
      var data = await get({ section: 'config', track: track.server || track.id });
      var root = document.createElement('div');
      $('workspace').innerHTML = ''; $('workspace').appendChild(root);
      var info = track.mount({ root: root, tabsEl: $('tabsSlot'), wb: pending.wb, fileName: pending.name, data: data,
        post: poster(track.server || track.id), saveFile: saveFile, toast: toast });
      current = track;
      $('home').hidden = true; $('loadMsg').textContent = ''; $('pick').hidden = true;
      $('trackSep').hidden = false; $('trackName').textContent = track.name; $('trackDesc').textContent = track.desc;
      $('chipQ').hidden = false; $('chipMode').hidden = false; $('chipMode').title = (info && info.note) || '';
      if (info && info.quarter) $('chipQ').textContent = info.quarter;
      $('chipMode').className = 'chip live'; $('chipMode').textContent = '작업 중: ' + pending.name;
      $('btnNew').hidden = false;
      document.title = track.name + ' · 정산 데스크';
      window.scrollTo(0, 0);
    } catch (err) {
      $('workspace').innerHTML = ''; $('tabsSlot').innerHTML = '';
      $('loadMsg').textContent = track.name + ' 정산으로 계산하지 못했습니다: ' + (err && err.message ? err.message : err);
    }
  }
  $('file').addEventListener('change', function () { handleFile(this.files[0]); this.value = ''; });
  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { handleFile(e.dataTransfer.files[0]); });
  $('pickBtn').addEventListener('click', function () {
    var id = $('pickSel').value, t = DESK.tracks.filter(function (x) { return x.id === id; })[0];
    if (t) open(t);
  });
  $('btnNew').addEventListener('click', function () { goHome(); $('loadMsg').textContent = ''; });

  // ---------- 잠금 ----------
  async function login(v) {
    if (!APPS_SCRIPT_URL) { $('gateMsg').textContent = '서버 주소가 아직 연결되지 않았습니다 (config.js의 appsScriptUrl).'; return; }
    setPw(v);
    $('gateMsg').textContent = '확인 중…'; $('gateBtn').disabled = true;
    try {
      await get({ section: 'ping' });
      $('gate').hidden = true; document.body.classList.remove('locked');
    } catch (e) {
      setPw(''); $('gateMsg').textContent = e.message || '서버에 연결하지 못했습니다';
    } finally { $('gateBtn').disabled = false; }
  }
  $('gateForm').addEventListener('submit', function (e) { e.preventDefault(); login($('gatePw').value.trim()); });
  $('btnLogout').addEventListener('click', function () { setPw(''); location.reload(); });
  renderTrackList(); goHome();
  if (pw()) login(pw()); else $('gatePw').focus();
})();
</script>

</body>
</html>
